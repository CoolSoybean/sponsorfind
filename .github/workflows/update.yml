name: Update and deploy
on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: production
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/setup@v2
        with:
          version: 11.19.0
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/cache/restore@v5
        with:
          path: public/data
          key: sponsor-data-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: sponsor-data-
      - run: pnpm install --frozen-lockfile
      - run: python -m unittest discover -s tests
      - run: pnpm test
      - run: python scripts/update_data.py
      - run: pnpm run test:data
      - run: pnpm build
      - name: Deploy validated snapshot
        run: pnpm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - uses: actions/cache/save@v5
        with:
          path: public/data
          key: sponsor-data-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: quality-report
          path: work/quality-report.json
          retention-days: 14

