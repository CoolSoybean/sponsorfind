<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="英才通：查询英国政府公开的签证赞助机构名录，按名称、地区和签证路线筛选。"><meta name="theme-color" content="#102c42"><link rel="icon" type="image/svg+xml" href="/favicon.svg"><title>英才通 · 发现英国签证赞助雇主</title></head><body><div id="root"></div><script type="module" src="/src/main.jsx"></script><script>
  (function () {
    var widget = document.createElement('script');
    var mobile = window.matchMedia('(max-width: 700px)').matches;
    widget.dataset.name = 'BMC-Widget';
    widget.dataset.cfasync = 'false';
    widget.src = 'https://cdnjs.buymeacoffee.com/1.0.0/widget.prod.min.js';
    widget.dataset.id = '0xkaiiak';
    widget.dataset.description = 'Support me on Buy me a coffee!';
    widget.dataset.message = '请momo喝咖啡';
    widget.dataset.color = '#15806D';
    widget.dataset.position = 'Right';
    widget.dataset.x_margin = mobile ? '12' : '18';
    widget.dataset.y_margin = mobile ? '12' : '18';
    widget.onload = function () {
      window.dispatchEvent(new Event('DOMContentLoaded', { bubbles: true }));
    };
    document.body.appendChild(widget);

    var paymentUrl = 'https://buymeacoffee.com/0xkaiiak';
    var popupOptions = 'popup,width=460,height=760,resizable=yes,scrollbars=yes';
    var attachPopup = function () {
      var button = document.getElementById('bmc-wbtn');
      if (!button || button.dataset.directPayment === 'true') return;
      button.dataset.directPayment = 'true';
      button.addEventListener('click', function (event) {
        event.preventDefault();
        event.stopImmediatePropagation();
        var mobile = window.matchMedia('(max-width: 700px)').matches;
        window.open(paymentUrl, 'bmc-payment', mobile ? '_blank' : popupOptions);
      }, true);
    };
    new MutationObserver(attachPopup).observe(document.body, { childList: true, subtree: true });
    attachPopup();
  }());
</script></body></html>
